name: Qijing
options:
  bundleIdPrefix: com.iqgamer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
packages:
  BoardCore:
    path: BoardCore
targets:
  Qijing:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: BoardCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 棋境
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqgamer.qijing
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
schemes:
  Qijing:
    build:
      targets:
        Qijing: all
    run:
      config: Debug
    archive:
      config: Release
