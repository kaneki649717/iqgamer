name: iOS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Linux，省额度）
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.2"
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: BoardCore/.build
          key: swiftpm-release-${{ hashFiles('BoardCore/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-release-${{ hashFiles('BoardCore/Package.swift') }}-
      - name: Run tests
        working-directory: BoardCore
        run: swift test -c release --parallel

  build-ipa:
    name: 构建未签名 IPA
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project Qijing.xcodeproj \
            -scheme Qijing \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Qijing.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Qijing.xcarchive/Products/Applications/Qijing.app build/Payload/
          cd build
          zip -qry Qijing-unsigned.ipa Payload
          ls -la Qijing-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qijing-unsigned-ipa
          path: build/Qijing-unsigned.ipa
